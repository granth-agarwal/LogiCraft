services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: logicraft
      POSTGRES_USER: logicraft
      POSTGRES_PASSWORD: logicraft
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logicraft"]
      interval: 2s
      timeout: 2s
      retries: 20


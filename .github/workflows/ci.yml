name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: logicraft, POSTGRES_USER: logicraft, POSTGRES_PASSWORD: logicraft}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U logicraft" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://logicraft:logicraft@localhost:5432/logicraft
      SUPABASE_URL: https://test.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e 'backend[dev]'
      - run: pytest backend --cov --cov-report=term-missing --cov-fail-under=90
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm run build


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["accounts*", "common*", "config*", "fleet*", "warehouse*", "shipments*", "scheduling*", "dashboard*", "notifications*"]

[project]
name = "logicraft-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "Django>=5.0,<6",
  "djangorestframework>=3.15,<4",
  "django-filter>=24,<26",
  "django-cors-headers>=4,<5",
  "dj-database-url>=2,<3",
  "psycopg2-binary>=2.9,<3",
  "PyJWT[crypto]>=2.8,<3",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-django>=4.8", "pytest-cov>=5", "factory-boy>=3.3", "freezegun>=1.5"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "--nomigrations --strict-markers"

[tool.coverage.run]
source = ["accounts", "fleet", "warehouse", "shipments", "scheduling", "dashboard", "notifications"]
omit = ["*/tests/*", "*/admin.py", "*/apps.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
